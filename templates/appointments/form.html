{% extends "base.html" %}{% block title %}New Appointment{% endblock %}{% block page_title %}Schedule Appointment{% endblock %}
{% block content %}
<div class="card" style="max-width:780px;">
  <div class="ch"><span class="ct">Appointment Details</span></div>
  <div class="cb">
    <form method="post">{% csrf_token %}
      <div class="fgrid">
        <div class="fg"><label>Patient *</label>
          <select name="patient" required>
            <option value="">— Select Patient —</option>
            {% for p in patients %}<option value="{{ p.pk }}">{{ p.full_name }}</option>{% endfor %}
          </select></div>
        <div class="fg"><label>Doctor</label>
          <select name="doctor"><option value="">— Unassigned —</option>
            {% for d in doctors %}<option value="{{ d.pk }}">Dr. {{ d.get_full_name }}</option>{% endfor %}
          </select></div>
        <div class="fg"><label>Date *</label><input type="date" name="date" value="{{ today }}" required></div>
        <div class="fg"><label>Time *</label><input type="time" name="time" required></div>
        <div class="fg"><label>Type *</label>
          <select name="appointment_type">
            <option value="consultation">Consultation</option><option value="follow_up">Follow-up</option>
            <option value="emergency">Emergency</option><option value="lab_test">Lab Test</option>
            <option value="vaccination">Vaccination</option><option value="procedure">Procedure</option>
          </select></div>
        <div class="fg full"><label>Reason</label><textarea name="reason" placeholder="Reason for visit…"></textarea></div>
      </div>
      <div class="mt4 flex gap2">
        <button type="submit" class="btn btn-pri">Schedule</button>
        <a href="{% url 'appointment_list' %}" class="btn btn-out">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
