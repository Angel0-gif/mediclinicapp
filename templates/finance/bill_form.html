{% extends "base.html" %}{% block title %}New Bill{% endblock %}{% block page_title %}Create Bill{% endblock %}
{% block content %}
<div class="card" style="max-width:900px;">
  <div class="ch"><span class="ct">Bill Details</span></div>
  <div class="cb">
    <form method="post">{% csrf_token %}
      <div class="fg"><label>Patient *</label>
        <select name="patient" required>
          <option value="">— Select Patient —</option>
          {% for p in patients %}<option value="{{ p.pk }}" {% if patient and patient.pk == p.pk %}selected{% endif %}>{{ p.full_name }}</option>{% endfor %}
        </select></div>
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin:12px 0;">
        <div class="flex jb ic" style="margin-bottom:12px;">
          <span style="font-weight:700;">Bill Items</span>
          <button type="button" onclick="addItem()" class="btn btn-pri btn-sm">+ Add Item</button>
        </div>
        <table style="width:100%;font-size:13px;"><thead>
          <tr><th>Description</th><th>Qty</th><th>Unit Price (XAF)</th><th>Subtotal</th><th></th></tr>
        </thead><tbody id="billRows"></tbody></table>
        <div style="text-align:right;font-size:15px;font-weight:700;margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0;">
          Total: <span id="totalDisplay">0</span> XAF
        </div>
      </div>
      <div class="fg"><label>Notes</label><textarea name="notes"></textarea></div>
      <div class="mt4 flex gap2">
        <button type="submit" class="btn btn-pri">Create Bill</button>
        <a href="{% url 'bill_list' %}" class="btn btn-out">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
function addItem(){
  const tb=document.getElementById('billRows');
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input type="text" name="description" placeholder="Service or item" style="width:100%;" oninput="calcTotal()"></td>
    <td><input type="number" name="quantity" value="1" min="1" style="width:70px;" oninput="calcTotal()"></td>
    <td><input type="number" name="unit_price" value="0" step="0.01" style="width:110px;" oninput="calcTotal()"></td>
    <td class="sub" style="font-weight:600;">0 XAF</td>
    <td><button type="button" onclick="this.closest('tr').remove();calcTotal()" class="btn btn-dan btn-sm">✕</button></td>`;
  tb.appendChild(tr);calcTotal();
}
function calcTotal(){
  let tot=0;
  document.querySelectorAll('#billRows tr').forEach(r=>{
    const q=parseFloat(r.querySelector('[name=quantity]')?.value||0);
    const p=parseFloat(r.querySelector('[name=unit_price]')?.value||0);
    const sub=q*p;tot+=sub;
    const sc=r.querySelector('.sub');if(sc)sc.textContent=sub.toLocaleString()+' XAF';
  });
  document.getElementById('totalDisplay').textContent=tot.toLocaleString();
}
addItem();
</script>
{% endblock %}
