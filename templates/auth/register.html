{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "New User" %}{% endblock %}
{% block page_title %}{% trans "Create User Account" %}{% endblock %}
{% block content %}
<div class="card" style="max-width:780px;">
  <div class="ch"><span class="ct">{% trans "New Staff / User Account" %}</span></div>
  <div class="cb">
    <form method="post">{% csrf_token %}
      <div class="fgrid">
        <div class="fg"><label>{% trans "First Name" %} *</label><input type="text" name="first_name" required></div>
        <div class="fg"><label>{% trans "Last Name" %} *</label><input type="text" name="last_name" required></div>
        <div class="fg"><label>{% trans "Username" %} *</label><input type="text" name="username" required></div>
        <div class="fg"><label>{% trans "Email" %}</label><input type="email" name="email"></div>
        <div class="fg"><label>{% trans "Password" %} *</label><input type="password" name="password" required></div>
        <div class="fg"><label>{% trans "Phone" %}</label><input type="text" name="phone"></div>
        <div class="fg"><label>{% trans "Role" %} *</label>
          <select name="role">
            <option value="admin">{% trans "Administrator" %}</option>
            <option value="doctor">{% trans "Doctor" %}</option>
            <option value="nurse">{% trans "Nurse" %}</option>
            <option value="cashier" selected>{% trans "Cashier" %}</option>
            <option value="receptionist">{% trans "Receptionist" %}</option>
            <option value="patient">{% trans "Patient" %}</option>
          </select>
        </div>
      </div>
      <div class="mt4 flex gap2">
        <button type="submit" class="btn btn-pri">{% trans "Create Account" %}</button>
        <a href="{% url 'staff_list' %}" class="btn btn-out">{% trans "Cancel" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
